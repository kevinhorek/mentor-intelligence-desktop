<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mentor Intelligence</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="checking" class="panel">
    <img src="logo.png" alt="" class="logo" width="72" height="72">
    <p class="muted">Connecting to Mentor Intelligence...</p>
  </main>
  <main id="offline" class="panel" hidden>
    <img src="logo.png" alt="" class="logo" width="72" height="72">
    <h1>You're offline.</h1>
    <p>Mentor Intelligence needs an internet connection.</p>
    <button id="retry" type="button">Retry</button>
  </main>
  <script src="start.js"></script>
</body>
</html>
